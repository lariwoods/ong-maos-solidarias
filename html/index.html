<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Mãos Solidárias — SPA</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#inicio" aria-label="Mãos Solidárias — página inicial">
      Mãos Solidárias
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menu de navegação"
      aria-expanded="false"
      aria-controls="menu-principal"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav
      id="menu-principal"
      class="main-nav"
      aria-label="Navegação principal"
    >
      <ul class="nav-list">
        <li><a href="#inicio">Início</a></li>

        <li class="dropdown">
          <a href="#projetos">Projetos <span aria-hidden="true">▾</span></a>
          <ul class="submenu">
            <li><a href="#projetos">Alimentação</a></li>
            <li><a href="#projetos">Agasalhos</a></li>
          </ul>
        </li>

        <li><a href="#cadastro">Cadastro</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="conteudo-principal">
  <div
    id="app"
    class="container"
    aria-live="polite"
    aria-atomic="false"
  ></div>
</main>

<div class="modal-backdrop" aria-hidden="true">
  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-description"
  >
    <div class="modal-header">
      <h2 id="modal-title">Participe da Mãos Solidárias</h2>

      <button
        class="modal-close"
        type="button"
        aria-label="Fechar janela de participação"
        data-fechar-modal
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>

    <p id="modal-description">
      Você pode contribuir como doador ou voluntário. Faça seu cadastro e escolha a forma de participação.
    </p>

    <a class="btn" href="#cadastro" data-fechar-modal>
      Ir para cadastro
    </a>
  </section>
</div>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 ONG Mãos Solidárias.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="../js/main.js"></script>
</body>
</html>
